services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wordcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wordcloud}
      POSTGRES_DB: ${POSTGRES_DB:-wordcloud}
    # Bind to localhost only so the database is never exposed to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wordcloud} -d ${POSTGRES_DB:-wordcloud}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wordcloud}:${POSTGRES_PASSWORD:-wordcloud}@db:5432/${POSTGRES_DB:-wordcloud}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  pgdata:
